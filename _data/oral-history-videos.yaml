- name: Inta Carpenter
  videos:
    - objectid: 81
      title: Life Story
      description: |
        Inta Carpenter recounts fleeing wartime Latvia as an infant, living in displaced persons camps in Germany, and immigrating to the United States where her family settled first in North Carolina and then Indianapolis. She trained in sociology and folklore at Indiana University, wrote a master’s thesis about her grandfather, completed a PhD on Latvian exile, and conducted fieldwork in Latvia, Brazil, and Siberia.

        Her communities within Latvian diaspora networks, local cooperative projects like Hobbit House, and public folklore initiatives, such as Traditional Arts Indiana, shaped her personal life and professional work. Her memories emphasize food, music, seasonal rituals, and multigenerational gatherings as central cultural practices.

    - objectid: 82
      title: About the Project
      description: |
        Inta Carpenter describes her role as research assistant and on-site coordinator for the Dorson Gary Project, which ran fieldwork from about 1975-1977 and culminated in a conference.
        She explains the project’s logistical burdens (securing funding, equipment, vehicles, housing, and transcription help) and how those administrative challenges shaped what the students could accomplish.

        Field teams documented diverse ethnic communities (Serbian, Croatian, Mexican, African American, Lithuanian, etc.), produced videotapes and interviews, and deposited materials across multiple IU repositories, creating a split collection that later prompted discussions about consolidation.

        Carpenter and the team hoped the collected materials would be transformed into usable teaching resources for introductory and advanced courses on urban folklore.

    - objectid: 83
      title: About Richard Dorson
      description: |
        Inta Carpenter recalls first meeting Richard Dorson when she applied to the folklore department and was admitted after an in‑office encounter, later serving as his editorial assistant and project coordinator. She describes Dorson as an ambitious leader who could be both humorous and partisan in supporting students and faculty.

        Carpenter details how their collaboration produced conferences, publications, and opportunities that shaped her career in applied and public folklore. She credits Dorson with opening professional doors while noting that his temperament sometimes created tensions within the department.

- name: John Hasse
  videos:
    - objectid: 84
      title: Life Story
      description: |
        John Hasse, born November 20, 1948, is a musician and folklorist raised in South Dakota in a family of educators and artists who nurtured his early piano and jazz interests. He studied jazz and ethnomusicology at Carleton and earned graduate degrees at Indiana University, where he trained in fieldwork, produced award-winning ragtime research, and completed a PhD.

        After a short period in corporate marketing, he became a longtime curator at the Smithsonian’s Division of Musical Instruments, combining performance, scholarship, archiving, and public outreach.

    - objectid: 85
      title: About the Project
      description: |
        John Hasse describes joining Dorson’s Calumet region project and focusing on documenting Black gospel music. He built community rapport by playing piano in churches, conducting interviews and recordings, and he later produced a half an hour documentary film called, “Gospel and Gary”.

        Hasse describes the project’s end deliverables and how the project aimed to archive the region’s cultural life, producing publications, films, and materials deposited at Indiana University while giving students firsthand exposure to Gary’s steel mills, churches, and ethnic communities.

- name: Richard March
  videos:
    - objectid: 86
      title: Life Story
      description: |
        Richard (Rick) March describes a bicultural childhood in a Croatian‑speaking household shaped by immigrant relatives, labor‑organizing parents, and moves from Chicago to Los Angeles. He spent summers working on a Central California farm, grew up immersed in Croatian community music and lodge activities, and participated in the 1960s folk and rock music scenes.

        Those layered experiences, as demonstrated in the ethnic storytelling from his grandmother, union and community activism, and hands-on rural life, helped steer him toward anthropology and folklore. He attended UCLA during the Vietnam era, played in bands, and ultimately chose academic study over pursuing the music industry full time.

    - objectid: 87
      title: About the Project
      description: |
        March joined Richard Dorson’s Gary Project as a research and teaching assistant due to his Serbo‑Croatian fluency and prior fieldwork experience. He documented Slavic musical traditions with bulky early videotape equipment, recorded key informants like tamburitza maker, Milan Opacic (including the memorable snapping‑turtle anecdote), and produced short, crudely edited videos used in classrooms.

        The project’s team‑based, urban folklife approach shaped his doctoral research on the tamburitza, kept him connected to community informants for years, and influenced his later career in public radio and public folklore work.

    - objectid: 88
      title: About Richard Dorson
      description: |
        March first met Dawson in 1973 and remembers him as a congenial, somewhat diminutive figure with a clear mission to make folklore a respected academic discipline. He recounts how Dorson insisted on rigorous documentation within fieldwork and publications, such as Chicago-style citations, verbatim transcription, and careful editing, and campaigned against “fakelore” (e.g., Paul Bunyan), favoring good writing and empirical fieldwork over abstract theoretical fashions.

        March notes how Dorson organized team-based field projects like the Gary Project, prioritized publication and practical standards, and framed American folklore in terms shaped by the nation’s land, history, and frontier traditions.

- name: Thomas Adler
  videos:
    - objectid: 89
      title: Life Story
      description: |
        Thomas Adler, born March 31, 1947 in Chicago, recounts growing up as the son of Viennese refugee physicians who met in the United States, with his father serving as a rural doctor in Frenchburg, Kentucky before the family settled in Chicago.

        He describes a household where his parents spoke German privately, his upbringing in South Shore during the 1950s, and early musical influences that led him to the banjo and bluegrass. He also notes that his father was featured in an RKO short film about new Americans, illustrating the family’s immigrant contribution to U.S. life.

    - objectid: 90
      title: About the Project
      description: |
        Adler joined Dorson’s Gary project as an experienced fieldworker from Cooperstown and was tasked mainly with locating and documenting Southern (white) migrants and their musical practices in the Calumet region. He recalls working largely alone or in small teams with personal cameras and institute video gear, describing the fieldwork as often scattershot and relatively superficial rather than deeply longitudinal.

        Adler also emphasizes that the project lacked sustained technical and archiving guidance (unlike later Library of Congress work), encountered well‑known local racial tensions, and relied on Dorson’s trust in experienced students to produce valuable documentation.

    - objectid: 91
      title: About Richard Dorson
      description: |
        Adler remembers first encountering Richard Dorson indirectly through mentors and at meetings, noting Dawson’s background as a historian and his text-focused approach in contrast to the folklife/material-culture orientation of other faculty.

        Adler describes Dorson as formal, hardworking, somewhat aloof but encouraging – reluctant to supervise closely, skeptical of students studying subjects they performed (like bluegrass), yet willing to admit past mistakes. Dorson set students to do fieldwork and shaped the project’s general aims and final documentation.

- name: Richard Vidutis
  videos:
    - objectid: 92
      title: Life Story
      description: |
        Richard Vidutis, born in Regensburg in 1945 to Lithuanian refugee parents, grew up in the multicultural, steel‑industry city of Gary, Indiana, where he was raised speaking Lithuanian at home and participating in parish cultural life. He initially intended to study astronomy at Indiana University but shifted to Slavic languages and folklore, spending time studying in Poland and later pursuing research interests connected to Lithuanian cultural materials.

        Vidutis describes strong ties to his Lithuanian heritage (e.g. Saturday schools, dances, and community life) and the lasting impact of displacement and anti‑immigrant sentiment on his family’s identity. He later returned to Lithuania several times, pursued scholarships in Europe, and continued work linking folkloric materials to education and cultural preservation.

    - objectid: 93
      title: About the Project
      description: |
        Richard Vidutis joined the Dorson Gary Project as a fieldworker and videographer, documenting ethnic traditions across the industrial region. The project opened his eyes to the depth and modernity of local traditions, taught him practical fieldwork skills, and emphasized teamwork and confronting social biases like racism. He remembers specific recordings (e.g. Easter egg makers, instrument makers) and values the project’s broad, collaborative scope.

    - objectid: 94
      title: About Richard Dorson
      description: |
        Vidutis emphasizes the project’s teamwork and the freedom to explore widely under Dorson’s direction. He reflects on how the experience shaped his later fieldwork approach and appreciation for collaborative investigations.

        He praises Dorson’s commitment to on‑the‑ground fieldwork while noting Dorson’s strict, demanding leadership style and a missed opportunity to engage more deeply with non‑English languages in the community.
