- name: Thomas Adler
  text: >
    Thomas A. Adler, born in Chicago in 1947, studied folklore formally in the 1970s at the Cooperstown Graduate Programs for his M.A., and then earned his Ph.D. at Indiana University. During his academic career he worked on team folklore projects for the Library of Congress, conducted numerous oral history interviews, and created research databases, interpretive videos, and digital photographic archives. After teaching at the University of Kentucky, he worked in a variety of information technology positions, including electronic publishing, digital video and website creation, before becoming the first Executive Director of the International Bluegrass Music Museum in Owensboro, Kentucky. His lifelong devotion to bluegrass music led both to his participation in a lengthy series of active bands, and to the 2011 publication of his book-length history of Bill Monroe's music park in Bean Blossom, Indiana. He later provided I.T. support for the University of Kentucky's Department of Orthopaedic Surgery and Sports Medicine.


    Now retired from the University of Kentucky, he stays active in folklore research and consulting. He is a strong supporter of the Kentucky Craft History and Education Association, and has developed the online [Kentucky Crafts Encyclopedia](https://www.ky-crafts.com). Adler plays a 5-string banjo built by renowned Kentucky craftsman Frank Neat, and also continues to perform in the central Kentucky area with several four-piece bluegrass bands. All this and more is documented on [his website](https://www.thomasadler.com).

- name: John Hasse
  text: >
    John Edward Hasse is a writer, speaker, and Curator Emeritus of American Music at the
    National Museum of American History. During his 33-year tenure at the Smithsonian, Hasse led an
    initiative to create the world's largest museum collection of jazz history, including the archives of
    Duke Ellington and Ella Fitzgerald. Hasse developed exhibitions on Ellington, Fitzgerald, Frank
    Sinatra, and Ray Charles. He founded the Smithsonian Jazz Masterworks Orchestra, now
    celebrating its 34<sup>th</sup> anniversary, and international Jazz Appreciation Month, which is
    celebrated in all 50 states and 40 other countries.


    His books include an acclaimed biography, _Beyond Category: The Life and Genius of
    Duke Ellington_, with a Foreword by Wynton Marsalis, and _Jazz: The First Century_, with
    Forewords by Quincy Jones and Tony Bennett, and a college textbook, _Discover Jazz_. As an
    expert on 20<sup>th</sup> century music, he is a contributor to _The Washington Post_ and eight
    encyclopedias and has written sixty-plus commentaries on music for _The Wall Street
    Journal_.


    His media appearances include CNN, CBS, PBS, BBC, NPR, and several documentary
    movies. He is the recipient of two Grammy Award nominations and two ASCAP awards for
    excellence in writing on music.


    He earned a B.A. Cum Laude from Carleton College, M.A. and Ph.D. degrees from
    Indiana University, a Certificate in Business Administration from The Wharton School, and
    two Honorary Doctorates.


    Active in cultural diplomacy for the U.S. State Department, Hasse has lectured on
    leadership, the arts, and music in 25 countries. His website is www.johnedwardhasse.com.
