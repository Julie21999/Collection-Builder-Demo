- name: Inta Carpenter
  text: >
    Inta Gale Carpenter was born in Baldone, Latvia, in 1944, and experienced her family's departure as refugees who spent five-years in UN Displaced Persons camps before settling in the U.S. in 1949. She completed her bachelor's degree in sociology at Chatham College in 1966, and after working in Colorado as a child welfare caseworker, she accompanied her husband, Bruce, to Bloomington, where she began graduate studies. In 1975, she completed her M.A. in folklore at Indiana University and accepted a position in the Folklore Institute as assistant (and then, associate) director of Special Projects, a unit dedicated to publications and public outreach. She held this position until her retirement in 2010. Publications realized during this period included the _Journal of the Folklore Institute_ (now _JFR_); a monograph series; _Handbook of American Folklore_ (ed. Richard Dorson, 1983); _Reflections on the Folklore Festival: An Ethnography of Participant Experience_, by Richard Bauman, Patricia Sawin, Inta Gale Carpenter (Special Publications of the Folklore Institute, No. 2,1992); _A Folklorist's Progress: Reflections of a Scholar's Life_, by Stith Thompson, with John Holmes McDowell and Inta Gale Carpenter as editors (1996); and a number of team projects (in the US and internationally), videos, and conferences.


    In 1989, after completing her doctorate in folklore and finishing a dissertation entitled "Being Latvian in Exile: Folklore as Ideology," she added the role of associate research scholar, with responsibilities divided between the Folklore Institute and her own research on Latvian diasporic identity formation and transmission. She conducted fieldwork in the US, Germany, Brazil, and Siberia, for which she was supported by grants from the ACLS, Fulbright, IREX, NEH, and IU. Carpenter published a monograph (_A Latvian Storyteller: The Repertoire of Jānis Pļavnieks_ (1980)), articles and book essays published in the U.S., Latvia, and Estonia, and was elected president of the Association for the Advancement of Baltic Studies (2004-2006).


    Known as an activist scholar, Carpenter advocated for an outreach dimension that integrated academic training and research with efforts to understand and address problems affecting local communities. To this end, in the 1990s she co-initiated the Activist Pedagogy Group, which served as an incubator for socially engaged student projects. In 1998, with funding from the Indiana Arts Commission and NEA, Carpenter founded Traditional Arts Indiana, whose mission is to document vernacular forms of culture throughout the state of Indiana. She also co-directed two field schools in Bloomington (in 2000 and 2001), in partnership with the American Folklife Center at the Library of Congress. During a four‐year period, she taught a course entitled Field Seminar in Cultural Documentation, which opened an arena of learning and cooperation that connected IU students with at‐risk Bloomington youth and residents of the city's federal housing neighborhood, for which she received a teaching award.
  brief: >
    Inta Carpenter holds a PhD in Folklore from Indiana University. She was the associate director of Special Projects at the Folklore Institute from 1975 until 2010, overseeing and providing edits on many journals and publications and participating in domestic and international folklore projects alike.


    In 2004, Carpenter was elected president of the Association for the Advancement of Baltic Studies. She was an “activist scholar,” founding outreach groups, working with local communities, and teaching courses at Indiana University. Her work focused on social justice, with many sources lauding her as a powerful, positive force in her community. Carpenter also founded Traditional Arts Indiana, a public folklore program to document local culture throughout the state.

- name: Richard Vidutis
  text: >
    Richard Vidutis is a disaster ethnographer and historian specializing in the documentation of cultural
    resources and heritage within post-storm landscapes. He holds a Ph.D. in Folklore from Indiana
    University. During the first half of his career, he worked on projects documenting community folklife,
    history, and intangible resources for agencies such as the National Park Service, Library of Congress
    Folklife Center, Smithsonian Center for Folklife and Cultural Heritage, Pennsylvania Heritage Affairs
    Commission, and private CRM firms. Along with the ever-increasing impact of climate change and
    related catastrophes, his focus has evolved to include disaster fieldwork across the United States,
    working with communities to rebuild their identity, memory, and especially sense of place in the wake
    of hurricane and flood events. During the last two decades, as a contractor through Jacobs
    Engineering, he has collaborated with FEMA's environmental and cultural resources division to
    implement Section 106 compliance, focusing on identifying damaged and lost resources with the goal
    of community reconstruction according to its stated requirements through forms of mitigation and
    preservation. Communities served were in Louisiana, Missouri, Iowa, New Jersey, and Puerto Rico.


    As the founder of Recordations, Richard operates a boutique research firm specializing in navigating
    the vast holdings of Washington, D.C.'s federal repositories. From the National Archives and the
    Library of Congress to specialized agency and military archives and collections. He provides expert
    archival retrieval and historical analysis for filmmakers, academics, museum curators, and
    environmental specialists.
  brief: >
    Richard Vidutis, PhD, is a disaster ethnographer and historian, specializing in the preservation of cultural resources after natural disasters. He received his doctorate in Folklore from Indiana University. He has worked for many public and private cultural resource management groups, including the US National Park Service and the Library of Congress Folklife center.


    Vidutis is the founder of Recordations, a research firm specializing in navigating federal archival repositories. He provides expert archival retrieval and historical analysis for filmmakers, academics, museum curators, and environmental specialists.

- name: Richard March
  text: >
    Working on Dr Richard M Dorson’s Gary Project proved to be the inflection point in my career as a
    folklorist, turning me toward public folklore, an emphasis not at all formally taught in Indiana’s grad
    program at the time.


    My path to becoming a grad student in Indiana University’s Folklore Institute was circuitous. In
    my childhood household, my immigrant mother and grandmother instilled a fascination with life in
    Nerezine, the Croatian island village they left behind. Through family and community life I was imbued
    with Croatian culture. I had early musical training in ethnic string ensembles that performed Slavic folk
    music. In addition, I played viola in the notably excellent school orchestra at Hollywood High. Those
    musical skills translated easily into becoming a guitar picker of American bluegrass and blues in the
    1960s folk music revival, music associated with my involvement in the civil rights and peace movements
    of that era.


    Although I was raised in mega-cities, Chicago and later Los Angeles, in my youth I also gained a
    perspective on rural culture. From the ages of 10 to 20 I chose to spend every summer vacation staying
    and working on the farm of my parents’ friends in central California.


    During my college years at UC Berkeley, I divided my time between earning a BA in
    Anthropology and acting, singing and playing guitar in Agit Prop, a political street theatre group. Next my
    itching heels took me to Croatia where I enrolled as an Ethnology student at the University of Zagreb. To
    support myself, I founded a jug band that performed frequently in Croatia and Slovenia and on Croatian
    radio and television.


    While still living in Zagreb, I was offered a Ford Fellowship by the Russian and East European
    Institute at Indiana University to return to the US and study Folklore. During my four years in southern
    Indiana, I played music with the area’s old time fiddlers and country musicians. But then in 1975, the
    Gary Project shifted my focus to northwestern Indiana and the active local South Slavic tamburitza music
    tradition familiar to me since childhood.


    A major goal of the Gary Project was to develop audio-visual curriculum materials on urban
    folklore through coordinated fieldwork efforts of a dedicated group of Dr Dorson’s students. Then in
    1976, the Bicentennial of the American Revolution arrived with funding to provide myriad opportunities
    for folklorists to identify and recruit tradition bearers to participate in the eleven-week Smithsonian
    Folklife Festival on the National Mall. A leader of that effort, my future mentor Bess Lomax Hawes, hired
    me to develop a Yugoslav-American program for the festival. I was successful. Through experience in
    Gary, I had learned to “parachute” into a previously unfamiliar city and promptly locate traditional artists.


    Back in Indiana, after a summer of working for the Smithsonian, our team learned that fellow
    “Gary Gang” member Elena Bradunas had been hired by the recently-established Center for American
    Folklife at the Library of Congress. Inspired by the Gary Project but motivated to improve upon it, Elena,
    a Chicagoan, launched a “Chicago Project” the next summer, hiring a slew of folklorists for coordinated
    team fieldwork. I had to hurry to complete my field reports on several Slavic groups in Chicago before
    departing to Croatia. I had been awarded a Fulbright Fellowship to research tamburitza music in Croatia,
    Serbia and Bosnia. Owing to the fellowship, this time I didn’t need to support myself as a musician. I was
    based at the Folk Arts Institute in Zagreb, once again among folklorists who carried out coordinated team
    fieldwork.


    When I returned to the US, I learned that Bess Hawes had become director of the newly-
    established Folk and Traditional Arts Program at the National Endowment for the Arts (NEA). For nearly
    five years, Bess kept me employed as a consultant or contract fieldworker for recipients of NEA grants.
    At the same time, I developed a folklore museum education program at the Milwaukee Public Museum.


    Through conversations with Bess Hawes, I came to understand that our work in public folklore
    was an effort to change cultural policy in the US, to support and nurture the people’s traditional arts. And
    Bess explained that in Washington, folk arts support could be cut with the stroke of a pen. Thus her
    strategy was to decentralize public folklore efforts from the NEA to the states—to have a state folklorist
    placed in the State Arts Agency or a related organization in every state and US territory. The NEA
    provided start-up funding for such positions and in 1983 I was hired to be Wisconsin’s first state folklorist
    at the Wisconsin Arts Board. I held that same job until I retired in 2009, more than a quarter century.
    Twice I turned down promotions in order to remain working in the field.


    Because the program was new, I was able to shape and design it. We had a small fund to award
    folk arts project grants. I initiated an apprenticeship program emphasizing the arts of Wisconsin’s eleven
    Native tribes and bands. I initiated Down Home Dairyland, a weekly program on Wisconsin Public Radio
    showcasing the traditional and ethnic musics of the Upper Midwest. For more than a decade I led a
    cultural exchange program with Chiba, Japan, Wisconsin’s sister state. In the odd numbered years we
    hosted about 15 artists from Chiba to perform in schools, festivals and community auditoriums. In the
    even numbered years, I selected about 15 Wisconsin folk artists to do the same in Chiba.


    I spearheaded efforts to increase the influence of public folklorists in national organizations, the
    American Folklore Society and National Assembly of State Arts Agencies, convening the first national
    gatherings of state folklorists in the late 1980s.


    I’ve often quipped that as a state folklorist, I’d never earn a million dollars, but in 1998,
    Wisconsin’s sesquicentennial, I was able to spend one and a half million dollars as director of Wisconsin’s
    Sesquicentennial Folk Festival, staged both on the National Mall and on Wisconsin's capitol square in
    Madison.


    The most important and fulfilling aspect of my career was the close ongoing relationships with the
    diverse and immensely talented folk artists of Wisconsin. I had resources at my disposal to enable these
    artists to enjoy validating experiences, like training a committed apprentice, performing in Washington,
    DC or Chiba, Japan or being awarded a National Heritage Fellowship, lifelong milestones for them.
    For over twenty-five years, I could hardly wait each morning to head to the Arts Board offices or
    drive a state car to a small town or city neighborhood to advance the work of the folk arts program. And it
    was Dr Dorson’s Gary Project that launched me in the direction of my long and fulfilling career.
  brief: >
    Richard March graduated with a doctorate in Folklore from Indiana University. He was Wisconsin’s first state folklorist, working under the Wisconsin Arts Board from 1983 until his retirement in 2009, proudly remarking, “twice I turned down promotions in order to remain working in the field.”


    March recalls his work on the Gary Project as the catalyst that enabled his long, fulfilling career in folklore. He had opportunities to work with the Smithsonian, the National Endowment for the Arts, and an international diplomacy program with Japan.

- name: Thomas Adler
  text: >
    Thomas A. Adler, born in Chicago in 1947, studied folklore formally in the 1970s at the Cooperstown Graduate Programs for his M.A., and then earned his Ph.D. at Indiana University. During his academic career he worked on team folklore projects for the Library of Congress, conducted numerous oral history interviews, and created research databases, interpretive videos, and digital photographic archives. After teaching at the University of Kentucky, he worked in a variety of information technology positions, including electronic publishing, digital video and website creation, before becoming the first Executive Director of the International Bluegrass Music Museum in Owensboro, Kentucky. His lifelong devotion to bluegrass music led both to his participation in a lengthy series of active bands, and to the 2011 publication of his book-length history of Bill Monroe's music park in Bean Blossom, Indiana. He later provided I.T. support for the University of Kentucky's Department of Orthopaedic Surgery and Sports Medicine.


    Now retired from the University of Kentucky, he stays active in folklore research and consulting. He is a strong supporter of the Kentucky Craft History and Education Association, and has developed the online [Kentucky Crafts Encyclopedia](https://www.ky-crafts.com). Adler plays a 5-string banjo built by renowned Kentucky craftsman Frank Neat, and also continues to perform in the central Kentucky area with several four-piece bluegrass bands. All this and more is documented on [his website](https://www.thomasadler.com).
  brief: >
    Thomas Adler was a lecturer at Indiana University and the University of Kentucky, later an information technology specialist at the latter. He holds a doctorate degree in Folklore from Indiana University. Adler holds a life-long fascination with bluegrass music, sporting the title of the first Executive Director of the International Bluegrass Music Museum in Owensboro, Kentucky.


    Now retired, Adler remains active in his passions for folklore and music. He developed an online resource for local arts in Kentucky, plays in multiple Kentucky bluegrass bands, and gives support for the Kentucky Craft History and Education Association.

- name: John Hasse
  text: >
    John Edward Hasse is a writer, speaker, and Curator Emeritus of American Music at the
    National Museum of American History. During his 33-year tenure at the Smithsonian, Hasse led an
    initiative to create the world's largest museum collection of jazz history, including the archives of
    Duke Ellington and Ella Fitzgerald. Hasse developed exhibitions on Ellington, Fitzgerald, Frank
    Sinatra, and Ray Charles. He founded the Smithsonian Jazz Masterworks Orchestra, now
    celebrating its 34<sup>th</sup> anniversary, and international Jazz Appreciation Month, which is
    celebrated in all 50 states and 40 other countries.


    His books include an acclaimed biography, _Beyond Category: The Life and Genius of
    Duke Ellington_, with a Foreword by Wynton Marsalis, and _Jazz: The First Century_, with
    Forewords by Quincy Jones and Tony Bennett, and a college textbook, _Discover Jazz_. As an
    expert on 20<sup>th</sup> century music, he is a contributor to _The Washington Post_ and eight
    encyclopedias and has written sixty-plus commentaries on music for _The Wall Street
    Journal_.


    His media appearances include CNN, CBS, PBS, BBC, NPR, and several documentary
    movies. He is the recipient of two Grammy Award nominations and two ASCAP awards for
    excellence in writing on music.


    He earned a B.A. Cum Laude from Carleton College, M.A. and Ph.D. degrees from
    Indiana University, a Certificate in Business Administration from The Wharton School, and
    two Honorary Doctorates.


    Active in cultural diplomacy for the U.S. State Department, Hasse has lectured on
    leadership, the arts, and music in 25 countries. His website is www.johnedwardhasse.com.
  brief: >
    For 33 years, John Hasse spearheaded the creation of the world’s largest museum of jazz history. He curated many museum exhibitions on jazz and its biggest icons and founded the archives of Duke Ellington and Ella Fitzgerald. He additionally founded the Smithsonian Jazz Masterworks Orchestra in the 1990s, still active today, and International Jazz Appreciation Month.


    Hasse holds a PhD in Folklore from Indiana University, has received two honorary doctorate degrees, has media appearances on CNN, CBS, PBS, BBC, and NPR, and two Grammy Award nominations and two ASCAP awards for excellence in writing on music. He also conducts cultural diplomacy for the US State Department.
